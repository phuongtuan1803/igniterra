.task-table tbody tr,.gpu-table tbody tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;border:1px solid var(--line);border-radius:10px;padding:13px;background:#fff}
.task-table tbody td,.gpu-table tbody td{border:0;padding:0;min-width:0!important}
.task-table tbody td:first-child,.gpu-table tbody td:first-child{grid-column:1/-1;padding-bottom:6px;border-bottom:1px solid var(--line)}
.task-table tbody td:nth-child(2),.gpu-table tbody td:nth-child(2){grid-column:1;align-self:center}
.task-table tbody td:nth-child(3),.gpu-table tbody td:nth-child(3){grid-column:2;align-self:center;min-width:92px!important}
.task-table tbody td:nth-child(4),.gpu-table tbody td:nth-child(4){grid-column:1;align-self:center;color:var(--muted)}
.task-table tbody td:nth-child(5),.gpu-table tbody td:nth-child(5){grid-column:2;text-align:right;align-self:center}
.task-table .progress{width:96px}
.task-table tbody tr:hover td,.gpu-table tbody tr:hover td{background:transparent}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

(()=>{'use strict';

const statusNames={waiting:'Chờ duyệt',running:'Đang xử lý',final:'Duyệt video cuối',done:'Hoàn tất',failed:'Có lỗi',ready:'Sẵn sàng',provisioning:'Đang cài đặt',destroy_unknown:'Chưa rõ đã hủy',destroying:'Đang hủy',destroyed:'Đã xác nhận hủy',stopped:'Đã dừng',approved:'Đã duyệt',needs_review:'Cần kiểm tra',succeeded:'Hoàn tất',unknown:'Chưa rõ kết quả',busy:'Đang chạy',pending:'Chờ duyệt',create_unknown:'Chưa rõ đã tạo',provision_failed:'Cài đặt thất bại'};

let rentals=[{id:'GPU-018',gpu:'RTX 4090',vram:24,provider:'Vast.ai',status:'ready',per:.34,cost:1.84,progress:100,instance:'1854291',steps:[1,1,1,1]},{id:'GPU-017',gpu:'RTX 3090',vram:24,provider:'Vast.ai',status:'provisioning',per:.22,cost:.49,progress:60,instance:'1854288',steps:[1,1,0,0]},{id:'GPU-016',gpu:'RTX A5000',vram:24,provider:'Vast.ai',status:'destroy_unknown',per:.29,cost:2.31,progress:0,instance:'1854021',steps:[1,1,1,1]}];

function taskById(id){return tasks.find(t=>t.id===id)}function rentalById(id){return rentals.find(r=>r.id===id)}function wfById(id){return workflows.find(w=>w.id===id)}
function nav(){const groups=[['PRODUCTION',[['tasks','film','Tasks'],['series','stack','Series Bible']]],['INFRASTRUCTURE',[['gpu','cpu','GPU Rentals'],['comfyui','flow','ComfyUI Workflows'],['monitor','monitor','Monitor']]],['',[['settings','settings','Settings']]]];let s='';for(const [label,items] of groups){if(label)s+=`<div class="nav-label">${label}</div>`;else s+='<div class="nav-divider"></div>';for(const [id,ic,title] of items){const active=state.view===id||(id==='tasks'&&state.view==='storyboard')||(id==='gpu'&&state.view==='rental')||(id==='comfyui'&&state.view==='workflow');const c=id==='tasks'?tasks.filter(t=>t.status==='waiting'||t.status==='final').length:0;s+=`<button class="nav-item ${active?'active':''}" data-action="nav" data-id="${id}" ${active?'aria-current="page"':''}>${ico(ic)}<span>${title}</span>${c?`<span class="nav-count">${c}</span>`:''}</button>`}}$('#sidebarNav').innerHTML=s;$('#sidebar').classList.toggle('open',state.menu);$('#scrim').classList.toggle('show',state.menu);$('#crumbTitle').textContent=names[state.view]||'Igniterra';$('#mobileNav').innerHTML=[['tasks','film','Tasks'],['gpu','cpu','GPU'],['comfyui','flow','ComfyUI'],['monitor','monitor','Monitor']].map(([id,ic,label])=>`<button class="${state.view===id?'active':''}" data-action="nav" data-id="${id}">${ico(ic)}${label}</button>`).join('');}

function metric(label,value,foot,iconName,important=false){return `<div class="metric ${important?'important':''}"><div class="caption"><span>${label}</span>${ico(iconName,'sm')}</div><div class="big">${value}</div><div class="foot">${foot}</div></div>`}
function pageTasks(){let attention=tasks.filter(t=>['waiting','final','failed'].includes(t.status)).length;let filtered=tasks.filter(t=>(state.filter==='all'||(state.filter==='review'?['waiting','final'].includes(t.status):state.filter==='running'?t.status==='running':state.filter==='done'?t.status==='done':t.status==='failed'))&&(`${t.title} ${t.id}`.toLowerCase().includes(state.taskSearch.toLowerCase())));return head('PRODUCTION / OVERVIEW','Không bỏ lỡ bước quan trọng','Một nơi để tạo, theo dõi và hoàn tất các video AI. Ưu tiên công việc cần bạn quyết định.',btn(`${ico('plus')} Tạo task`,'new-task','primary'))+`<div class="metrics">${metric('CẦN QUAN TÂM',attention,'2 chờ duyệt · 1 lỗi','alert',true)}${metric('ĐANG XỬ LÝ',tasks.filter(t=>t.status==='running').length,'Task có worker đang chạy','clock')}${metric('VIDEO HOÀN TẤT',tasks.filter(t=>t.status==='done').length,'Đã qua bước duyệt cuối','check')}${metric('CHI PHÍ ĐÃ GHI',`$${tasks.reduce((a,t)=>a+t.usd,0).toFixed(2)}`,'Số liệu minh họa, không phải hóa đơn','dollar')}</div>
<div class="alert">${ico('alert')}<div style="flex:1"><strong>Có 2 video đang chờ bạn duyệt</strong><p>Chọn một video để kiểm tra keyframes hoặc duyệt bản dựng cuối.</p></div>${btn('Xem storyboard','open-default-storyboard','sm soft')}</div>
<div class="columns"><section class="card pad"><div class="section-title"><div><h2>Danh sách sản xuất</h2><p>Chọn task để tiếp tục đúng công đoạn.</p></div></div><div class="filter-row">${[['all','Tất cả'],['review','Cần duyệt'],['running','Đang chạy'],['done','Hoàn tất'],['failed','Có lỗi']].map(([id,label])=>`<button class="filter ${state.filter===id?'active':''}" data-action="task-filter" data-id="${id}">${label}</button>`).join('')}<div class="searchfield">${ico('search','sm')}<input class="input" id="taskSearch" aria-label="Tìm task" placeholder="Tìm tên video..." value="${esc(state.taskSearch)}"></div></div><div class="table-wrap task-table"><table><thead><tr><th>Video</th><th>Trạng thái</th><th>Tiến độ</th><th>Chi phí</th><th></th></tr></thead><tbody>${filtered.length?filtered.map(t=>`<tr><td style="min-width:180px"><div class="item-title">${esc(t.title)}</div><div class="item-sub">${t.id} · ${esc(t.series)}</div></td><td>${chip(t.status)}</td><td style="min-width:114px"><div class="small muted" style="margin-bottom:6px">${esc(t.step)}</div><div class="progress"><span style="width:${t.progress}%"></span></div></td><td><strong>$${t.usd.toFixed(2)}</strong></td><td><button class="textlink" data-action="open-task" data-id="${t.id}">Xem ${ico('arrow','sm')}</button></td></tr>`).join(''):`<tr><td colspan="5"><div class="no-items">Không tìm thấy task phù hợp.</div></td></tr>`}</tbody></table></div></section>
<aside class="stack"><section class="card pad"><div class="section-title"><div><h2>Việc tiếp theo</h2><p>Gợi ý theo trạng thái dữ liệu demo.</p></div></div><div class="activity-list"><div class="activity-item"><span class="activity-icon">${ico('film')}</span><div style="flex:1"><strong>Duyệt ảnh keyframes</strong><p>Tín hiệu từ ngày mai · 6 scene</p><button class="textlink" data-action="open-task" data-id="VID-024">Tiếp tục ${ico('arrow','sm')}</button></div></div><div class="activity-item"><span class="activity-icon">${ico('play')}</span><div style="flex:1"><strong>Kiểm tra bản video cuối</strong><p>Những vì sao im lặng</p><button class="textlink" data-action="open-task" data-id="VID-022">Mở bản duyệt ${ico('arrow','sm')}</button></div></div><div class="activity-item"><span class="activity-icon">${ico('cpu')}</span><div style="flex:1"><strong>Đối soát GPU chưa rõ trạng thái</strong><p>GPU-016 · Có thể vẫn tính phí</p><button class="textlink" data-action="open-rental" data-id="GPU-016">Kiểm tra GPU ${ico('arrow','sm')}</button></div></div></div></section><section class="card pad"><div class="section-title"><h2>Truy cập nhanh</h2></div><div class="action-pair">${btn(`${ico('cpu')} GPU Rentals`,'nav','','data-id="gpu"')}${btn(`${ico('monitor')} Monitor`,'nav','','data-id="monitor"')}</div><div class="notice mt12">${ico('info','sm')}<span>Không thao tác nào trong prototype này gửi yêu cầu đến model, nhà cung cấp GPU hoặc worker.</span></div></section></aside></div>`;}
function pageStoryboard(){let task=taskById(state.activeTask)||tasks[0];let s=scenes[state.activeScene];let final=task.status==='final';let waiting=task.status==='waiting';return head(`TASKS / ${task.id}` ,esc(task.title),`${esc(task.desc)} · ${esc(task.series)}`,btn(`${ico('arrow')} Về danh sách`,'nav','','data-id="tasks"'))+`${waiting?`<div class="gatebar"><div>${chip('waiting','Chờ duyệt keyframes')}<strong style="display:block;margin-top:6px">Chọn ảnh phù hợp cho các scene trước khi duyệt</strong><p>Chỉ duyệt khi bạn đã kiểm tra các keyframes cần thiết.</p></div><div class="flex gap8">${btn('Từ chối','reject-gate','')}${btn(`${ico('check')} Duyệt keyframes`,'approve-gate','primary')}</div></div>`:final?`<div class="gatebar"><div>${chip('waiting','Chờ duyệt bản cuối')}<strong style="display:block;margin-top:6px">Video đã dựng xong, cần review trước khi xuất bản</strong><p>Xem phần kiểm tra cuối ở bên dưới để quyết định.</p></div>${btn(`${ico('arrow')} Đến bước duyệt cuối`,'go-final','soft')}</div>`:`<div class="notice mb16">${ico('info','sm')}<span>${chip(task.status)} ${esc(task.step)} · Đây là trạng thái minh họa, không có worker đang chạy.</span></div>`}

function pageGPU(){let bill=rentals.filter(r=>!['destroyed'].includes(r.status)), unknown=rentals.filter(r=>['destroy_unknown','create_unknown'].includes(r.status));let list=state.gpuTab==='rentals';let results=offers.filter(o=>o.vram>=state.minVRAM&&o.price<=state.maxUSD);return head('INFRASTRUCTURE / GPU','Kiểm soát GPU và chi phí','Luôn biết máy nào có thể đang tính phí, trạng thái provisioning và hành động an toàn tiếp theo.',btn(`${ico('monitor')} Mở Monitor`,'nav','','data-id="monitor"'))+`<div class="metrics">${metric('CÓ THỂ ĐANG TÍNH PHÍ',bill.length,'Chỉ provider xác nhận hủy mới kết thúc','dollar',true)}${metric('GPU SẴN SÀNG',rentals.filter(r=>r.status==='ready').length,'Đã qua health & smoke test','check')}${metric('CẦN ĐỐI SOÁT',unknown.length,'Không gửi lại thao tác khi chưa rõ','alert')}${metric('CHI PHÍ ƯỚC TÍNH',`$${rentals.reduce((v,r)=>v+r.cost,0).toFixed(2)}`,'Demo · chưa tính bandwidth','clock')}</div>

<section class="card pad"><div class="tabs"><button class="tab ${list?'active':''}" data-action="gpu-tab" data-id="rentals">Máy của tôi</button><button class="tab ${!list?'active':''}" data-action="gpu-tab" data-id="offers">Tìm GPU</button></div>${list?`<div class="section-title"><div><h2>Máy đã thuê</h2><p>Nhấn vào máy để xem tiến độ, sự kiện và thao tác hủy.</p></div><span class="small muted">${rentals.length} máy · dữ liệu demo</span></div><div class="table-wrap gpu-table"><table><thead><tr><th>GPU / Provider</th><th>Trạng thái</th><th>Giá mỗi giờ</th><th>Chi phí ước tính</th><th></th></tr></thead><tbody>${rentals.map(r=>`<tr><td><div class="item-title">${r.gpu} · ${r.vram} GB</div><div class="item-sub">${r.id} · ${r.provider}</div></td><td>${chip(r.status)}</td><td><strong>$${r.per.toFixed(2)}</strong><span class="muted">/giờ</span></td><td><strong>$${r.cost.toFixed(2)}</strong></td><td>${btn(`${ico('arrow')} Chi tiết`,'open-rental','sm',`data-id="${r.id}"`)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="section-title"><div><h2>Tìm cấu hình phù hợp</h2><p>Tham khảo offer mẫu; giá không lấy trực tiếp từ nhà cung cấp.</p></div></div><div class="form-grid mb16"><div class="field"><label for="vramFilter">VRAM tối thiểu</label><select class="select" id="vramFilter"><option value="16" ${state.minVRAM===16?'selected':''}>16 GB</option><option value="24" ${state.minVRAM===24?'selected':''}>24 GB</option><option value="48" ${state.minVRAM===48?'selected':''}>48 GB</option></select></div><div class="field"><label for="priceFilter">Ngân sách tối đa ($/giờ)</label><input class="input" id="priceFilter" type="number" min="0.01" step="0.05" value="${state.maxUSD}"></div></div><div class="table-wrap gpu-table"><table><thead><tr><th>GPU</th><th>VRAM / Disk</th><th>Độ tin cậy</th><th>Giá ước tính</th><th></th></tr></thead><tbody>${results.length?results.map(o=>`<tr><td><strong>${o.gpu}</strong><div class="item-sub">${o.verified?'Verified':'Unverified'} · Vast.ai</div> function pageRental(){let r=rentalById(state.selectedRental)||rentals[0], bill=r.status!=='destroyed';return head(`GPU RENTALS / ${r.id}`,`${r.gpu} · ${r.vram} GB`,`${r.provider} · Instance ${r.instance} · Giá ước tính $${r.per.toFixed(2)}/giờ`,btn(`${ico('arrow')} Tất cả GPU`,'nav','','data-id="gpu"'))+`${bill?`<div class="alert ${r.status.includes('unknown')?'red':''}">${ico('alert')}<div style="flex:1"><strong>Máy có thể vẫn đang được tính phí</strong><p>Chỉ khi nhà cung cấp xác nhận trạng thái destroyed mới xem là kết thúc chi phí.</p></div>${chip(r.status)}</div>`:`<div class="notice mb16">${ico('check','sm')} Nhà cung cấp đã xác nhận hủy (mô phỏng).</div>`}<div class="metrics" style="grid-template-columns:repeat(3,minmax(0,1fr))">${metric('TRẠNG THÁI',statusNames[r.status]||r.status,'Cập nhật trong phiên demo','clock')}${metric('CHI PHÍ ƯỚC TÍNH','$'+r.cost.toFixed(2),'Không phải hoá đơn provider','dollar')}${metric('MỨC GIÁ','$'+r.per.toFixed(2)+'/h','Chưa tính băng thông','cpu')}</div><div class="columns equal"><section class="card pad"><div class="section-title"><div><h2>Tiến độ provisioning</h2><p>Đang hoàn thành bước nào, có thể chạy workflow chưa?</p></div>${chip(r.status)}</div><div class="step-list">${[['Host khởi động','Máy ảo được provider tạo'],['Kết nối bảo mật','Auth và endpoint có xác thực'],['ComfyUI hoạt động','API /system_stats phản hồi'],['Smoke test','Workflow mẫu cho ra output']].map((step,i)=>`<div class="step ${r.steps[i]?'done':i===r.steps.findIndex(x=>!x)?'active':''}"><span class="step-num">${r.steps[i]?ico('check','sm'):i+1}</span><div><strong>${step[0]}</strong><p>${step[1]} · ${r.steps[i]?'Đạt':'Chưa có bằng chứng'}</p></div></div>`).join('')}</div>${r.status==='provisioning'?btn(`${ico('refresh')} Mô phỏng bước tiếp theo`,'provision-next','soft mt12'):''}<details class="mt20"><summary class="small muted" style="cursor:pointer">Chi tiết kỹ thuật (manifest / instance)</summary><div class="code-block mt12">Instance ID: ${r.instance}\n <section class="card pad"><div class="section-title"><div><h2>Điều khiển máy</h2><p>Chỉ hiển thị hành động phù hợp trạng thái.</p></div></div><div class="notice mb16">${ico('shield','sm')}<span>Lệnh hủy có thể làm mất dữ liệu trên instance. Kiểm output trước khi thực hiện.</span></div><div class="stack">${['ready','stopped'].includes(r.status)?btn(`${ico('flow')} Xem workflow ComfyUI`,'nav','','data-id="comfyui"'):''}${r.status==='ready'?btn('Stop máy (còn phí lưu trữ)','stop-rental'):''}${['destroy_unknown','destroying','create_unknown'].includes(r.status)?btn(`${ico('refresh')} Đối soát với provider (demo)`,'reconcile-rental'):''}${['ready','stopped','provisioning','provision_failed'].includes(r.status)?btn('Destroy máy và dữ liệu','destroy-rental','danger'):''}${r.status==='destroyed'?'<p class="muted small">Instance này đã kết thúc trong phiên demo.</p>':''}</div><div class="section-line"><h3>Lịch sử trạng thái</h3><div class="timeline mt12"><div><strong>${statusNames[r.status]||r.status}</strong><small>Trạng thái hiện tại · dữ liệu minh hoạ</small></div><div><strong>Đã ghi nhận chi phí thuê</strong><small>$${r.cost.toFixed(2)} USD ước tính</small></div><div><strong>Instance được tạo</strong><small>Vast.ai · ${r.instance}</small></div></div></div></section></div>`;}
function pageComfyUI(){const library=state.wfTab==='library';return head('INFRASTRUCTURE / COMFYUI','Workflows dễ kiểm soát','Nhập workflow, kiểm phụ thuộc, chọn GPU sẵn sàng và nhận kết quả đã xác minh.',btn(`${ico('upload')} Nhập workflow`,'import-workflow','primary'))+`<div class="metrics">${metric('WORKFLOWS',workflows.length,'Đã nhập vào thư viện demo','flow')}${metric('ĐÃ DUYỆT',workflows.filter(w=>w.status==='approved').length,'Có thể dùng nếu GPU ready','check')}${metric('CHỜ REVIEW',workflows.filter(w=>w.status==='needs_review').length,'Thiếu thông tin dependency','alert',true)}${metric('LƯỢT CHẠY',runs.length,'Dữ liệu mô phỏng','monitor')}</div><section class="card pad"><div class="tabs"><button class="tab ${library?'active':''}" data-action="wf-tab" data-id="library">Thư viện workflow</button><button class="tab ${!library?'active':''}" data-action="wf-tab" data-id="runs">Lượt chạy</button></div>${library?`<div class="section-title"><div><h2>Workflow đã nhập</h2><p>Chỉ workflow được duyệt và có API JSON mới có thể chạy.</p></div></div><div class="table-wrap"><table><thead><tr><th>Workflow</th><th>Revision</th><th>Dependency</th><th>Trạng thái</th><th></th></tr></thead><tbody>${workflows.map(w=>`<tr><td style="min-width:190px"><div class="item-title">${esc(w.name)}</div><div class="item-sub">${esc(w.kind)} · ${w.id}</div></td><td>rev ${w.version}</td><td>${w.models} model · ${w.nodes} nodes</td><td>${chip(w.status)}</td><td>${btn(`${ico('arrow')} Chi tiết`,'open-workflow','sm',`data-id="${w.id}"`)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="section-title"><div><h2>Lượt chạy gần đây</h2><p>Liên kết từng run với workflow và GPU cụ thể.</p></div></div><div class="table-wrap"><table><thead><tr><th>Run / Task</th><th>Workflow</th><th>GPU</th><th>Trạng thái</th><th></th></tr></thead><tbody>${runs.map(r=>`<tr><td><strong>${r.id}</strong><div class="item-sub">${r.task}</div></td><td>${r.workflow}</td><td>${r.rental}</td><td>${chip(r.status)}</td><td> function pageWorkflow(){let w=wfById(state.selectedWorkflow)||workflows[0], ready=rentals.filter(r=>r.status==='ready');return head(`COMFYUI / ${w.id}`,esc(w.name),`Revision ${w.version} · ${w.kind}`,btn(`${ico('arrow')} Thư viện`,'nav','','data-id="comfyui"'))+`<div class="columns equal"><section class="card pad"><div class="section-title"><div><h2>Chuỗi kiểm tra trước khi chạy</h2><p>Luôn làm rõ lý do workflow chưa sẵn sàng.</p></div>${chip(w.status)}</div><div class="step-list">${[['Đã import workflow','GUI JSON / API JSON'],['Đã khai manifest','Model và custom node được ghi nhận'],['Dependency được duyệt','Commit, SHA-256, license'],['Chọn GPU ready','Instance qua health + smoke'],['Chạy & xác minh output','Không đánh dấu thành công khi chưa kiểm file']].map(([n,d],i)=>`<div class="step ${(i<2||(i===2&&w.status==='approved'))?'done':(i===2?'active':'')}"><span class="step-num">${i<2||(i===2&&w.status==='approved')?ico('check','sm'):i+1}</span><div><strong>${n}</strong><p>${d}</p></div></div>`).join('')}</div>${w.status==='needs_review'?`<div class="warning-box mt20"><strong>Chưa thể chạy.</strong><div class="mt12">Manifest cần duyệt ngoài web bằng CLI trong phiên bản hiện tại:</div><div class="code-block mt12">python -m studio comfyui manifest approve &lt;SHA&gt;</div>${btn(`${ico('copy','sm')} Sao chép hướng dẫn`,'copy-cli','sm mt12')}</div>`:''}</section><section class="card pad"><div class="section-title"><div><h2>Chạy workflow</h2><p>Xác nhận GPU và chi phí trước khi gửi run.</p></div></div>${w.status==='approved'&&w.runnable?`${ready.length?`<div class="field"><label for="gpuForRun">GPU đã sẵn sàng</label><select class="select" id="gpuForRun">${ready.map(r=>`<option value="${r.id}">${r.gpu} · ${r.id} · $${r.per.toFixed(2)}/h</option>`).join('')}</select><p class="helper">Instance vẫn tính phí trong quá trình chạy.</p></div><div class="notice mt20">${ico('shield','sm')}<span>Run chỉ là mô phỏng trong trình duyệt. Không submit ComfyUI prompt.</span></div>${btn(`${ico('play')} Chạy workflow (demo)`,'run-workflow','primary mt20 wide')}`:'<div class="warning-box">Hiện không có GPU ready. Chuyển tới GPU Rentals để theo dõi provisioning.</div>'+btn('Đến GPU Rentals','nav','mt12','data-id="gpu"')}`:'<div class="warning-box">Không thể chạy: workflow chưa được duyệt hoặc thiếu API JSON. Kiểm lại dependency trước.</div>'}<div class="section-line"><h3>Thông tin workflow</h3><div class="info-grid mt12"><div class="info-cell"><span>Models</span><strong>${w.models}</strong></div><div class="info-cell"><span>Custom nodes</span><strong>${w.nodes}</strong></div><div class="info-cell"><span>Revision</span><strong>${w.version}</strong></div></div></div></section></div>`;}
function pageMonitor(){let alerts=[...rentals.filter(r=>r.status==='destroy_unknown').map(r=>({title:`${r.id} · Hủy chưa xác nhận`,desc:'Máy có thể vẫn đang tính phí',to:'rental',id:r.id})),...runs.filter(r=>r.status==='unknown').map(r=>({title:`${r.id} · Kết quả chưa rõ`,desc:'Không gửi lại run trước khi đối soát',to:'run',id:r.id})),...tasks.filter(t=>t.status==='failed').map(t=>({title:`${t.id} · Tác vụ gặp lỗi`,desc:t.step,to:'task',id:t.id}))];return head('OPERATIONS / MONITOR','Tình trạng toàn hệ thống','Nhìn thấy những việc cần xử lý trước, thay vì đọc log và ghép dữ liệu thủ công.',btn(`${ico('refresh')} Làm mới (demo)`,'refresh-monitor'))+`<div class="metrics">${metric('CẦN XỬ LÝ',alerts.length,'Unknown / failed / cost risk','alert',true)}${metric('RUN ĐANG CHẠY',runs.filter(r=>r.status==='running').length,'Tiến độ minh hoạ','flow')}${metric('GPU CÓ THỂ TÍNH PHÍ',rentals.filter(r=>r.status!=='destroyed').length,'Đã gồm máy có trạng thái unknown','dollar')}${metric('OUTPUT CHỜ XÁC MINH',runs.filter(r=>r.status==='succeeded'&&r.output).length,'Không xóa GPU trước khi kiểm','shield')}</div><div class="columns"><section class="card pad"><div class="section-title"><div><h2>Cần chú ý</h2><p>Các vấn đề ảnh hưởng tiến độ và chi phí.</p></div>${chip('review',`${alerts.length} mục`)}</div><div class="activity-list">${alerts.map(a=>`<div class="activity-item"><span class="activity-icon" style="color:var(--red);background:var(--red-soft)">${ico('alert')}</span><div style="flex:1"><strong>${esc(a.title)}</strong><p>${esc(a.desc)}</p></div>${btn('Xử lý','monitor-action','sm',`data-kind="${a.to}" data-id="${a.id}"`)}</div>`).join('')}</div></section><section class="card pad"><div class="section-title"><div><h2>Trạng thái theo luồng</h2><p>Task → Run → GPU</p></div></div>${runs.map(r=>`<div class="activity-item"><span class="activity-icon">${ico('flow')}</span><div style="min-width:0;flex:1"><strong>${r.id} ${chip(r.status)}</strong><p>${r.task} · ${r.workflow} · ${r.rental}</p><div class="progress mt12"><span style="width:${r.progress}%"></span></div></div><button class="textlink" data-action="open-run" data-id="${r.id}">${ico('arrow','sm')}</button></div>`).join('')}<p class="helper mt20">Trong sản phẩm thật: Monitor tự làm mới từ SQLite, không tự gọi provider.</p></section></div>`;}
function pageSeries(){return head('PRODUCTION / SERIES','Nhất quán từ scene đầu đến cuối','Giữ phong cách, giọng đọc và đặc điểm nhân vật dùng lại qua nhiều video.',btn(`${ico('plus')} Thêm nhân vật (demo)`,'add-character','primary'))+`<div class="columns equal"><section class="card pad"><div class="section-title"><div><h2>Sci-fi Shorts</h2><p>Series đang dùng cho 3 task minh hoạ.</p></div>${chip('approved','Đang sử dụng')}</div><div class="form-stack"><div class="field"><label>Phong cách hình ảnh</label><textarea class="textarea">Cinematic science fiction, atmospheric lighting, coherent palette, restrained composition.</textarea></div><div class="form-grid"><div class="field"><label>Giọng đọc</label><select class="select"><option>vi-VN-NamMinhNeural</option></select></div><div class="field"><label>Nhịp độ giọng</label><input class="input" value="1.0" type="number" step="0.05"></div></div>${btn('Lưu Series Bible (demo)','save-series','primary')}</div></section><section class="card pad"><div class="section-title"><div><h2>Nhân vật và ảnh tham chiếu</h2><p>Không phải thay đổi từng scene khi nhân vật xuất hiện lại.</p></div></div><div class="flex" style="gap:16px;align-items:flex-start">${art(1,'vertical')}<div style="flex:1"><h3>Người gác trạm</h3><p class="muted small mt12">Bộ đồ phi hành gia, ánh mắt bình tĩnh, mái tóc ngắn. Giữ silhouette và thiết kế đồng nhất.</p>${btn('Chọn ảnh tham chiếu','series-reference','sm mt20')}</div></div><div class="divider"></div><div class="notice">${ico('info','sm')}<span>Thay đổi Series Bible trong sản phẩm thật có thể làm thay đổi phần phụ thuộc của task ở lần chạy sau.</span></div></section></div>`;}
function pageSettings(){return head('CONFIGURATION / SETTINGS','Công cụ và giới hạn','Ưu tiên các cấu hình người vận hành thực sự cần. Các tùy chọn sâu có thể mở khi cần.')+`<div class="columns equal"><section class="card pad"><div class="section-title"><div><h2>Provider mặc định</h2><p>Cấu hình chỉ lưu trong phiên prototype.</p></div></div><div class="form-stack"><div class="field"><label>Image provider</label><select class="select"><option>ComfyUI (ready endpoint)</option><option>OmniRoute</option><option>None</option></select></div><div class="field"><label>Text provider</label><select class="select"><option>OmniRoute</option><option>None</option></select></div><div class="field"><label>Video provider</label><select class="select"><option>None</option><option>ComfyUI</option></select></div>${btn('Lưu cấu hình (demo)','save-settings','primary')}</div></section><section class="card pad"><div class="section-title"><div><h2>An toàn và chi phí</h2><p>Luôn kiểm tra thao tác phát sinh tiền.</p></div></div><label class="checkboxline"><input type="checkbox" checked><span>Bắt buộc duyệt keyframes trước khi dựng video</span></label><label class="checkboxline"><input type="checkbox" checked><span>Xác nhận trước khi chạy tác vụ trả phí</span></label><label class="checkboxline"><input type="checkbox" checked><span>Cảnh báo GPU có trạng thái unknown</span></label><div class="divider"></div><details><summary class="small" style="cursor:pointer;font-weight:750">Thông số nâng cao</summary><div class="field mt12"><label>Giới hạn song song</label><input type="number" class="input" min="1" max="16" value="2"></div><p class="helper mt12">Thao tác lưu thực tế có thể yêu cầu khởi động lại worker.</p></details></section></div>`;}
function render(){nav();const pages={tasks:pageTasks,storyboard:pageStoryboard,gpu:pageGPU,rental:pageRental,comfyui:pageComfyUI,workflow:pageWorkflow,monitor:pageMonitor,series:pageSeries,settings:pageSettings};$('#app').innerHTML=(pages[state.view]||pageTasks)();}
let toastTimer;function toast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3300)}
function openModal(title,body,footer){state.modal=true;$('#modal').innerHTML=`<div class="modal-head"><div><div class="eyebrow mb8">IGNITERRA · PROTOTYPE</div><h2 id="modalTitle">${title}</h2></div><button class="modal-close" aria-label="Đóng" data-action="close-modal">${ico('close')}</button></div><div class="modal-body">${body}</div>${footer?`<div class="modal-actions">${footer}</div>`:''}`;$('#modalBackdrop').classList.add('open');document.body.style.overflow='hidden';setTimeout(()=>$('#modal [data-action="close-modal"]')?.focus(),20)}
function closeModal(){state.modal=null;$('#modalBackdrop').classList.remove('open');document.body.style.overflow=''}
function confirmModal(title,details,okLabel,action,id='',warning=false){openModal(esc(title),`<div class="${warning?'danger-box':'warning-box'}">${details}</div><p class="muted small mt20">Đây là thao tác giả lập để kiểm tra thiết kế. Không có yêu cầu mạng hay chi phí thật.</p>`,`${btn('Hủy','close-modal')}${btn(esc(okLabel),action,warning?'danger':'primary',`data-id="${id}"`)}`)}
function action(a,el){const id=el?.dataset?.id, r=rentalById(id);switch(a){case 'toggle-menu':state.menu=!state.menu;nav();break;case 'nav':navigate(id);break;case 'open-default-storyboard':navigate('storyboard',{activeTask:'VID-024',activeScene:0});break;case 'open-task':navigate('storyboard',{activeTask:id,activeScene:0});break;case 'open-rental':navigate('rental',{selectedRental:id});break;case 'open-workflow':navigate('workflow',{selectedWorkflow:id});break;case 'task-filter':state.filter=id;render();break;case 'scene-select':state.activeScene=+id;render();break;case 'candidate-select':scenes[state.activeScene].sel=+id;render();toast('Đã chọn ảnh ứng viên trong bản demo.');break;case 'gpu-tab':state.gpuTab=id;render();break;case 'wf-tab':state.wfTab=id;render();break;case 'close-modal':closeModal();break;
case 'new-task':openModal('Tạo một task mới',`<form id="newTaskForm" class="form-stack"><div class="field"><label for="briefName">Chọn brief có sẵn</label><select class="select" id="briefName"><option value="Tín hiệu bí ẩn">Tín hiệu bí ẩn</option><option value="Một ngày trên hành tinh xa">Một ngày trên hành tinh xa</option><option value="Câu chuyện khoa học ngắn">Câu chuyện khoa học ngắn</option></select></div><div class="field"><label for="taskTitle">Tên video</label><input class="input" id="taskTitle" maxlength="120" required placeholder="Ví dụ: Tín hiệu bí ẩn" autofocus></div><div class="field"><label for="taskSeries">Series (không bắt buộc)</label><select class="select" id="taskSeries"><option value="">Không dùng series</option><option>Sci-fi Shorts</option><option>Dystopian</option></select></div><details><summary class="small" style="cursor:pointer;font-weight:750">Nâng cao · nhập JSON / model override</summary><div class="field mt12"><label for="taskJson">JSON tùy chọn</label><textarea class="textarea mono" id="taskJson" placeholder='{"title":"..."}'></textarea></div><p class="helper mt12">Chỉ kiểm tra cú pháp JSON trong prototype; không chạy model.</p></details></form><div class="notice mt20">${ico('info','sm')}<span>Trong ứng dụng thật, tạo task có thể dẫn đến lời gọi API trả phí sau khi worker tiếp tục.</span></div>`,`${btn('Hủy','close-modal')}${btn(`${ico('plus')} Tạo task (demo)`,'create-task','primary')}`);break;
case 'create-task':{let val=$('#taskTitle')?.value.trim(),json=$('#taskJson')?.value.trim();if(!val){$('#taskTitle')?.focus();toast('Nhập tên video trước khi tạo.');break}if(json){try{JSON.parse(json)}catch(e){toast('JSON không hợp lệ.');$('#taskJson')?.focus();break}}let next='VID-'+String(25+tasks.length-5).padStart(3,'0');tasks.unshift({id:next,title:val,status:'waiting',step:'Chờ khởi chạy (demo)',usd:0,progress:0,series:$('#taskSeries').value||'Không có series',desc:'Task tạo trong phiên demo.'});closeModal();navigate('tasks');toast(`Đã tạo ${next} trong bộ nhớ phiên demo.`);break}
case 'save-scene':scenes[state.activeScene].narration=$('#sceneNarration').value;scenes[state.activeScene].prompt=$('#scenePrompt').value;toast('Đã lưu scene trong phiên demo.');break;
case 'rerun-scene':confirmModal('Chạy lại scene?',`Nếu chạy thật, scene ${scenes[state.activeScene].id} có thể gọi model và phát sinh chi phí. Các scene khác không tự động chạy lại.`, 'Xác nhận mô phỏng','do-rerun','',false);break;
case 'do-rerun':closeModal();toast('Đã mô phỏng yêu cầu rerun. Không gọi model.');break;
case 'approve-gate':confirmModal('Duyệt keyframes',`Bạn đã kiểm tra đủ ảnh và lời dẫn cho ${scenes.length} scene chưa? Trong ứng dụng thật, duyệt sẽ cho phép tiếp tục pipeline.`, 'Duyệt (demo)','confirm-gate');break;
case 'confirm-gate':taskById(state.activeTask).status='running';taskById(state.activeTask).step='Đã duyệt, chờ worker';taskById(state.activeTask).progress=62;closeModal();render();toast('Đã mô phỏng duyệt keyframes.');break;
case 'reject-gate':confirmModal('Từ chối keyframes?',`Pipeline sẽ chưa được tiếp tục. Đây chỉ là thay đổi trạng thái phiên demo.`, 'Từ chối (demo)','confirm-reject');break;
case 'confirm-reject':closeModal();toast('Đã mô phỏng từ chối.');break;
case 'go-final':$('#finalReview')?.scrollIntoView({behavior:'smooth',block:'start'});break;
case 'approve-final':{let count=[...document.querySelectorAll('.final-check:checked')].length;if(count<4){toast('Hãy kiểm tra đủ 4 tiêu chí minh họa.');break}confirmModal('Duyệt video cuối',`Xác nhận đã xem và đánh giá bản render. Việc xuất bản thực tế không nằm trong prototype.`, 'Duyệt bản cuối (demo)','confirm-final');break}
case 'confirm-final':taskById(state.activeTask).status='done';taskById(state.activeTask).step='Đã duyệt';taskById(state.activeTask).progress=100;closeModal();render();toast('Đã chuyển task sang Hoàn tất (demo).');break;
case 'reject-final':confirmModal('Từ chối bản cuối?',`Không phê duyệt render hiện tại. Cần chỉnh sửa trước khi xuất lại.`, 'Từ chối (demo)','confirm-reject');break;
case 'rent-offer':{let o=offers.find(x=>x.id===id);confirmModal('Xác nhận thuê GPU',`<strong>${o.gpu} · ${o.vram} GB VRAM</strong><div class="mt12">Giá mẫu: <strong>$${o.price.toFixed(2)}/giờ</strong></div><div class="mt12">Ổ đĩa: ${o.disk} GB · Reliability ${o.reliability}</div><p class="mt12">Thao tác thuê thật yêu cầu xác nhận quote, giới hạn chi phí và manifest đã duyệt. Prototype không thực hiện API create.</p>`,'Thuê (mô phỏng)','confirm-rent',id);break}
case 'confirm-rent':{let o=offers.find(x=>x.id===id);let n='GPU-'+String(19+rentals.length-3).padStart(3,'0');rentals.unshift({id:n,gpu:o.gpu,vram:o.vram,provider:'Vast.ai',status:'provisioning',per:o.price,cost:0,progress:0,instance:'demo-'+n,steps:[0,0,0,0]});closeModal();navigate('rental',{selectedRental:n});toast('Đã thêm máy mẫu. Không phát sinh chi phí thật.');break}
case 'provision-next':{let rr=rentalById(state.selectedRental);let idx=rr.steps.indexOf(0);if(idx>=0)rr.steps[idx]=1;rr.progress=Math.round(rr.steps.filter(Boolean).length*25);if(rr.steps.every(Boolean))rr.status='ready';render();toast(rr.status==='ready'?'Đã mô phỏng đủ health + smoke, GPU ready.':'Đã mô phỏng hoàn thành một bước.');break}
case 'stop-rental':confirmModal('Stop GPU?',`Stop không nhất thiết ngừng phí lưu trữ. Instance sẽ còn trong danh sách để tiếp tục quản lý.`, 'Stop (demo)','confirm-stop',state.selectedRental);break;
case 'confirm-stop':rentalById(id).status='stopped';closeModal();render();toast('Đã mô phỏng stop; phí lưu trữ vẫn có thể phát sinh.');break;
case 'destroy-rental':confirmModal('Destroy GPU và dữ liệu?',`<strong>${esc(state.selectedRental)}</strong><p class="mt12">Hủy instance có thể làm mất file chưa tải. Hãy kiểm output. Không mặc định coi API trả về thành công là đã ngừng tính phí.</p>`, 'Gửi yêu cầu hủy (demo)','confirm-destroy',state.selectedRental,true);break;
case 'confirm-destroy':rentalById(id).status='destroying';closeModal();render();toast('Đã mô phỏng gửi lệnh destroy. Chưa xác nhận hủy.');break;
case 'reconcile-rental':confirmModal('Đối soát trạng thái?',`Ứng dụng thật cần đọc trạng thái thực tế của provider trước khi đánh dấu destroyed. Đối với demo này, bạn có thể mô phỏng xác nhận nhà cung cấp.`, 'Xác nhận đã hủy (demo)','confirm-reconcile',state.selectedRental);break;
case 'confirm-reconcile':rentalById(id).status='destroyed';closeModal();render();toast('Đã mô phỏng xác nhận provider: destroyed.');break;
case 'import-workflow':openModal('Nhập workflow JSON',`<div class="form-stack"><div class="field"><label for="workflowName">Tên workflow</label><input class="input" id="workflowName" maxlength="120" placeholder="Ví dụ: Character consistent render"></div><div class="field"><label for="workflowFile">Workflow JSON (đọc cục bộ)</label><input class="input" id="workflowFile" type="file" accept=".json,application/json"></div><p class="helper">Prototype chỉ kiểm tra file có thể parse thành JSON; không trích dependency thật, không gửi file ra mạng.</p></div>`,`${btn('Hủy','close-modal')}${btn('Nhập (demo)','confirm-import','primary')}`);break;
case 'confirm-import':{let file=$('#workflowFile')?.files?.[0],wn=$('#workflowName')?.value.trim();if(!wn||!file){toast('Cần tên và tệp JSON.');break}if(file.size>2*1024*1024){toast('Tệp demo tối đa 2 MB.');break}file.text().then(t=>{try{let j=JSON.parse(t);if(j===null||typeof j!=='object')throw Error('not object');let next='WF-'+String(104+workflows.length-3);workflows.unshift({id:next,name:wn,kind:'JSON import',version:1,status:'needs_review',runnable:false,models:0,nodes:0});closeModal();navigate('workflow',{selectedWorkflow:next});toast('Đã nhập JSON cục bộ. Cần review dependency thật.')}catch(err){toast('Tệp không phải JSON object hợp lệ.')}}).catch(()=>toast('Không thể đọc file trên thiết bị.'));break}
case 'copy-cli':{const value='python -m studio comfyui manifest approve <SHA>';navigator.clipboard?.writeText(value).then(()=>toast('Đã sao chép lệnh CLI.')).catch(()=>toast(value));break}
case 'run-workflow':{let rr=$('#gpuForRun')?.value;confirmModal('Chạy workflow trên GPU?',`<strong>Workflow:</strong> ${esc(state.selectedWorkflow)}<div class="mt12"><strong>GPU:</strong> ${esc(rr)}</div><div class="mt12">Có thể tính phí GPU và model. Cần xác nhận trước khi thực hiện.</div>`, 'Chạy (demo)','confirm-run',rr);break}
case 'confirm-run':{let n='RUN-'+String(105+runs.length-3);runs.unshift({id:n,workflow:state.selectedWorkflow,rental:id,task:'—',status:'running',progress:15,output:false});closeModal();navigate('monitor');toast(`Đã tạo ${n} trong Monitor (demo).`);break}
case 'open-run':{let run=runs.find(x=>x.id===id);if(!run)break;openModal(`${run.id} · Chi tiết lượt chạy`,`<div class="form-stack"><div class="pillline">${chip(run.status)}<span class="muted small">Workflow ${run.workflow}</span></div><div class="info-grid"><div class="info-cell"><span>Task</span><strong>${run.task}</strong></div><div class="info-cell"><span>GPU</span><strong>${run.rental}</strong></div><div class="info-cell"><span>Tiến độ</span><strong>${run.progress}%</strong></div></div><div class="progress"><span style="width:${run.progress}%"></span></div><div class="notice">${ico('info','sm')}<span>Trạng thái trong bộ nhớ browser. Chưa có output thật để tải hoặc kiểm SHA.</span></div></div>`,`${btn('Xem GPU','open-rental','',`data-id="${run.rental}"`)}${run.status==='running'?btn('Hoàn thành run (demo)','complete-run','primary',`data-id="${run.id}"`):run.status==='succeeded'&&run.output?btn('Xác minh output (demo)','verify-output','primary',`data-id="${run.id}"`):btn('Đóng','close-modal')}`);break}
case 'complete-run':{let run=runs.find(x=>x.id===id);run.status='succeeded';run.progress=100;run.output=true;closeModal();render();toast('Đã mô phỏng run thành công, output chưa xác minh.');break}
case 'verify-output':{let run=runs.find(x=>x.id===id);run.output=false;closeModal();render();toast('Đã mô phỏng xác minh output. Không tạo file thật.');break}
case 'monitor-action':{let kind=el.dataset.kind;if(kind==='rental')navigate('rental',{selectedRental:id});else if(kind==='task')navigate('storyboard',{activeTask:id,activeScene:0});else action('open-run',{dataset:{id}});break}
case 'refresh-monitor':toast('Đã làm mới giao diện từ dữ liệu demo trong bộ nhớ.');break;
case 'save-settings':case 'save-series':case 'series-reference':case 'add-character':toast('Đây là bản xem trước. Không lưu ra backend.');break;
default:toast('Chức năng demo đang được thiết kế.');}}
document.addEventListener('click',e=>{let target=e.target.closest('[data-action]');if(target){e.preventDefault();action(target.dataset.action,target)}else if(e.target.id==='scrim'){state.menu=false;nav()}else if(e.target.id==='modalBackdrop'){closeModal()}});
document.addEventListener('input',e=>{if(e.target.id==='taskSearch'){state.taskSearch=e.target.value;let pos=e.target.selectionStart;render();let el=$('#taskSearch');el?.focus();el?.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='vramFilter'){state.minVRAM=+e.target.value;render()}if(e.target.id==='priceFilter'){state.maxUSD=Number(e.target.value)||0;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal)closeModal();else if(e.key==='Escape'&&state.menu){state.menu=false;nav()}});
render();
})();
</script>
</body>
</html>
