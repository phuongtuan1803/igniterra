[project]
name = "studio"
version = "0.1.0"
description = "Igniterra studio: core tối thiểu + adapter cho video ngắn AI theo scene"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mpt==1.3.9",
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: gọi dịch vụ thật (chạy tay: pytest -m live)"]
addopts = "-m 'not live'"
